name: Star History

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  star-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Star History
        uses: narayann7/star-history-action@v1
        with:
          repos: ${{ github.repository }}

      - name: Commit and push only if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md || true
          if git diff --cached --quiet; then
            echo "No star history chart changes to commit, exiting."
            exit 0
          fi
          git commit -m "chore: update star history chart [skip ci]"
          git push origin HEAD:${GITHUB_REF#refs/heads/}
