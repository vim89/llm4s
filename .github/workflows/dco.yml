name: DCO

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check_dco:
    name: Check DCO sign-off
    runs-on: ubuntu-latest

    steps:
      - name: Run dco-check
        uses: christophebedard/dco-check@0.5.0 # v0.5.0
        with:
          python-version: '3.12'
          args: '--verbose'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
